<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<!--
  社交分享卡片（assets/og.png，1200×630）的模板。
  不要直接开这个文件：@font-face 里的字体占位符要由 tools/make-og.mjs
  换成人形站点里那份内嵌的 display 子集（base64），字体才只有一处来源。
  改这里之后跑一次 node tools/make-og.mjs。
-->
<style>
@font-face{font-family:"HeadToToeDisplay";src:url(__FONT__) format("woff2");font-weight:500;font-style:normal}
:root{
  --bg:#F2EDE3; --ink:#17140F; --ink-2:#575047; --ink-3:#6D6559;
  --wb:#44603B; --pe:#C0432A; --wl:#1B5E54; --os:#B45309; --se:#A9583E; --eye:#3F5C8A;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif;
  --serif:"HeadToToeDisplay","Source Han Serif SC","Noto Serif SC","Songti SC",serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
body{padding:54px 64px;display:flex;flex-direction:column;justify-content:space-between;
  font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
h1{margin:0;font-family:var(--serif);font-weight:500;font-size:118px;line-height:.98;letter-spacing:.01em}
.lead{margin:18px 0 0;font-family:var(--serif);font-size:29px;color:var(--ink);line-height:1.4}
.meta{margin:14px 0 0;font-family:var(--mono);font-size:13px;color:var(--ink-3);letter-spacing:.04em}
.row{display:flex;align-items:flex-end;gap:26px;border-top:1px solid rgba(23,20,15,.14);padding-top:20px}
.item .k{display:flex;align-items:baseline;gap:7px}
.dot{display:inline-block;width:8px;height:8px;flex:none;transform:translateY(-2px);border-radius:50%}
.item .n{font-family:var(--serif);font-size:20px;font-weight:500;white-space:nowrap}
.item .s{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:5px;letter-spacing:.03em;white-space:nowrap}
.url{position:absolute;right:64px;top:54px;font-family:var(--mono);font-size:13px;color:var(--ink-3);letter-spacing:.04em;white-space:nowrap}
</style></head><body>
<div class="url">dpenglish-com.github.io</div>
<div>
  <h1>从头到脚</h1>
  <p class="lead">六个产品，各管一处。</p>
  <p class="meta">一个作者 · 六件东西 · 六支片 · 六份在线试用</p>
</div>
<div class="row">
  <div class="item"><div class="k"><span class="dot" style="background:var(--wb)"></span><span class="n">脑袋 · 问辩</span></div><div class="s">思辨 · 论证</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--eye)"></span><span class="n">眼睛 · 课蒸馏</span></div><div class="s">听课 · 蒸馏</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--pe)"></span><span class="n">嘴巴 · PaperEcho</span></div><div class="s">语言 · 考试</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--se)"></span><span class="n">嘴巴 · SE English</span></div><div class="s">语言 · 课程</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--wl)"></span><span class="n">身体 · WorkoutLoop</span></div><div class="s">训练 · 编排</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--os)"></span><span class="n">着装 · 外在</span></div><div class="s">穿搭 · 审美</div></div>
</div>
</body></html>
