<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<!--
  社交分享卡片（assets/og.png，1200×630）的模板。
  不要直接开这个文件：@font-face 里的字体占位符要由 tools/make-og.mjs
  换成人形站点里那份内嵌的词标子集（base64），字体才只有一处来源。
  渲染命令看那个脚本。改这里之后跑一次 node tools/make-og.mjs，它会重新出图。
-->
<style>
@font-face{font-family:"Wordmark";src:url(__FONT__) format("woff2");font-weight:500;font-style:normal}
:root{
  --bg:#0C0D0F; --ink:#E8EAED; --ink-2:#AAACAF; --ink-3:#888A8E;
  --wb:#C0D5AC; --pe:#E2603F; --wl:#6FBFAE; --os:#E8944F; --se:#CC785C; --eye:#8AA0C8;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
body{padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;
  font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
h1{margin:0;font-family:"Wordmark","Songti SC","Source Han Serif SC",serif;font-weight:500;
  font-size:112px;line-height:1.0;letter-spacing:.02em}
.lead{margin:26px 0 0;font-size:27px;color:var(--ink-2);line-height:1.5}
.codebar{display:flex;gap:2px;height:3px;width:520px;margin-top:38px}
.codebar i{display:block;height:100%}
.row{display:flex;align-items:flex-end;gap:16px}
.item .k{display:flex;align-items:baseline;gap:7px}
.dot{display:inline-block;width:8px;height:8px;flex:none;transform:translateY(-2px)}
/* 每加一个产品这一行就要再紧一档，否则右下角的域名会被挤出画布。
   五个产品时 21→18、间距 48→26；六个产品再收到 15 / 16。 */
.item .n{font-size:15px;font-weight:700;white-space:nowrap}
.item .s{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:6px;letter-spacing:.04em;white-space:nowrap}
.url{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--ink-3);letter-spacing:.04em;white-space:nowrap}
</style></head><body>
<div>
  <h1>从头到脚</h1>
  <p class="lead">嘴上、脑子里、身上、着装、眼睛。六个产品，各管一处。</p>
  <div class="codebar"><i style="flex:3;background:var(--wb)"></i><i style="flex:3;background:var(--pe)"></i><i style="flex:2;background:var(--wl)"></i><i style="flex:2;background:var(--os)"></i><i style="flex:2;background:var(--eye)"></i></div>
</div>
<div class="row">
  <div class="item"><div class="k"><span class="dot" style="background:var(--wb)"></span><span class="n">脑袋 · 问辩</span></div><div class="s">思辨 · 论证</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--pe)"></span><span class="n">嘴巴 · PaperEcho</span></div><div class="s">语言 · 考试</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--se)"></span><span class="n">嘴巴 · SE English</span></div><div class="s">语言 · 课程</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--wl)"></span><span class="n">身体 · WorkoutLoop</span></div><div class="s">训练 · 编排</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--os)"></span><span class="n">着装 · 外在</span></div><div class="s">穿搭 · 审美</div></div>
  <div class="item"><div class="k"><span class="dot" style="background:var(--eye)"></span><span class="n">眼睛 · 课蒸馏</span></div><div class="s">听课 · 蒸馏</div></div>
  <div class="url">dpenglish-com.github.io</div>
</div>
</body></html>
