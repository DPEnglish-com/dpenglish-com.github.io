<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkoutLoop · 在线试用</title>
<!--
  离线试用版。零外部请求、零依赖。深色主题（三个产品里唯一深色的那个）。
  取色与比例照 ui/theme/Color.kt 的深色主题与 README 的界面说明：
    背景 #0E1412 · 卡 #171E1C · 文字 #DFE4E0 · 进行态松青 #8AD5C5 · 休息态暖橙 #FFB59B
    环：12dp 宽，从 12 点顺时针消耗；完成一组用音量键，不点屏幕。
-->
<style>
:root{
  --bg:#0E1412; --card:#171E1C; --line:#2C3331; --ink:#DFE4E0; --mute:#88948E;
  --work:#8AD5C5; --rest:#FFB59B; --done:#A9B7F0; --warn:#E0A0A0;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"Geist Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.75}
body{padding:26px 20px 44px}
.wrap{max-width:1100px;margin:0 auto}
[hidden]{display:none !important}

.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:25px;font-weight:600;letter-spacing:-.3px}
.bar p{margin:6px 0 0;font-size:13px;color:var(--mute)}
.toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{appearance:none;border:0;background:transparent;color:var(--mute);
  font-family:var(--font);font-size:13px;padding:9px 18px;cursor:pointer}
.toggle button + button{border-left:1px solid var(--line)}
.toggle button[aria-pressed="true"]{background:var(--work);color:#0E1412}
button:focus-visible{outline:2px solid var(--work);outline-offset:3px}
.hint{margin:14px 0 0;font-size:13px;color:var(--mute);min-height:20px}

.stage{margin-top:22px;display:flex;justify-content:center}
.device{border:1px solid var(--line);border-radius:20px;background:var(--bg);padding:18px;width:100%}
.device[data-device="phone"]{max-width:412px}
.device[data-device="tablet"]{max-width:940px}

/* 队列 */
.queue{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--mute);
  background:transparent;font-family:var(--font);cursor:default}
.qitem[data-state="current"]{border-color:var(--work);color:var(--ink)}
.qitem[data-state="done"]{color:var(--work);border-color:rgba(138,213,197,.35)}
.qitem small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:inherit;opacity:.75}

.grid{display:grid;gap:26px;align-items:center}
.device[data-device="phone"] .grid{grid-template-columns:1fr}
.device[data-device="tablet"] .grid{grid-template-columns:1fr 380px}

.ringwrap{position:relative;display:grid;place-items:center;margin:0 auto}
.device[data-device="phone"] .ringwrap{width:300px;height:300px}
.device[data-device="tablet"] .ringwrap{width:340px;height:340px}
svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
svg.ring .track{fill:none;stroke:#1E2624;stroke-width:12}
svg.ring .bar{fill:none;stroke:var(--work);stroke-width:12;stroke-linecap:butt;
  transition:stroke .25s linear}
.center{position:relative;text-align:center}
.center .big{font-family:var(--mono);font-size:64px;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.center .lab{margin-top:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.center .state{margin-top:6px;font-size:14px;color:var(--work)}

.panel{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:20px}
.panel h2{margin:0 0 6px;font-size:15px;font-weight:600}
.panel p{margin:0;font-size:13px;color:var(--mute);line-height:1.9}
.keys{display:flex;gap:12px;margin-top:18px}
.key{flex:1;appearance:none;border:1px solid var(--line);border-radius:12px;background:var(--bg);
  color:var(--ink);font-family:var(--font);font-size:13px;padding:16px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.3}
.key b{font-family:var(--mono);font-size:18px;font-weight:400}
.key small{color:var(--mute);font-size:11px}
.key:active,.key.down{background:#1E2624;border-color:var(--work)}
.key[disabled]{opacity:.45;cursor:not-allowed}
.metrics{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.metric{font-size:12px;color:var(--mute)}
.metric b{display:block;font-family:var(--mono);font-size:20px;color:var(--ink);font-weight:400;margin-top:4px}
.start{margin-top:18px;width:100%;appearance:none;border:0;border-radius:12px;background:var(--work);
  color:#0E1412;font-family:var(--font);font-size:14px;font-weight:600;padding:14px;cursor:pointer}
.foot{margin-top:22px;font-size:12px;color:var(--mute);line-height:1.9;
  border-top:1px solid var(--line);padding-top:14px}
.flash{font-size:12px;color:var(--work);min-height:18px;margin-top:10px;font-family:var(--mono)}
@media (max-width: 600px){
  .bar{flex-direction:column;align-items:stretch;gap:14px}
  .toggle{align-self:flex-start}
  .toggle button{white-space:nowrap}
  body{padding:18px 14px 32px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div>
      <h1>WorkoutLoop</h1>
      <p>训练计划按顺序循环推进，完成当前训练才进入下一项。</p>
    </div>
    <div class="toggle" role="group" aria-label="切换设备">
      <button type="button" data-dev="phone" aria-pressed="true">手机</button>
      <button type="button" data-dev="tablet" aria-pressed="false">平板</button>
    </div>
  </div>
  <p class="hint" id="hint">手机：环居中，两枚键帽在下面 —— 一组只有两个动作。</p>

  <div class="stage">
    <div class="device" id="device" data-device="phone">
      <div class="queue" id="queue" aria-label="训练队列"></div>

      <div class="grid">
        <div class="ringwrap">
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="track" cx="100" cy="100" r="88"></circle>
            <circle class="bar" id="bar" cx="100" cy="100" r="88"></circle>
          </svg>
          <div class="center">
            <div class="big" id="big" role="timer" aria-live="off">12</div>
            <div class="lab" id="lab">本组剩余</div>
            <div class="state" id="state">进行中</div>
          </div>
        </div>

        <div class="panel">
          <h2 id="pTitle">推训练</h2>
          <p id="pDesc">2 个动作 · 约 6 分钟。音量键完成本组或暂停，手上有汗也不用点屏幕。</p>

          <div class="keys">
            <button class="key" id="up" type="button"><b>音量 +</b><small>完成本组 / 继续</small></button>
            <button class="key" id="down" type="button"><b>音量 −</b><small>暂停 / 恢复</small></button>
          </div>
          <div class="flash" id="flash" role="status"></div>

          <div class="metrics">
            <div class="metric">已完成组数<b id="mSets">0</b></div>
            <div class="metric">已用时间<b id="mTime">00:00</b></div>
            <div class="metric">计划剩余<b id="mLeft">3 项</b></div>
          </div>
          <button class="start" id="start" type="button">开始训练</button>
        </div>
      </div>
    </div>
  </div>

  <p class="foot" id="foot">
    离线试用：这是产品训练流程的模拟，不是真实服务。正式版是 Android 应用，
    无账号、数据只存在手机上；源码清单未声明 INTERNET 权限。
  </p>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var device = $('device');

  /* 训练队列：练完一项才轮到下一项 —— 这是这个产品的主张。 */
  var PLAN = [
    { name: '推训练', items: '2 个动作', min: '约 6 分钟', sets: 3, hold: 12 },
    { name: '拉训练', items: '3 个动作', min: '约 9 分钟', sets: 3, hold: 10 },
    { name: '腿训练', items: '2 个动作', min: '约 7 分钟', sets: 4, hold: 15 }
  ];
  var qi = 0, setNo = 0, running = false, left = PLAN[0].hold, elapsed = 0, tickId = null, rest = 0;

  var HINT = {
    phone: '手机：环居中，两枚键帽在下面 —— 一组只有两个动作。',
    tablet: '平板：环在左，队列与读数在右 —— 一屏能看见整个循环：做到哪、还剩几项。'
  };
  function setDevice(dev) {
    device.dataset.device = dev;
    Array.prototype.forEach.call(document.querySelectorAll('.toggle button'), function (x) {
      x.setAttribute('aria-pressed', String(x.dataset.dev === dev));
    });
    $('hint').textContent = HINT[dev];
    draw();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.toggle button'), function (b) {
    b.addEventListener('click', function () { setDevice(b.dataset.dev); });
  });
  setDevice(window.innerWidth >= 760 ? 'tablet' : 'phone');

  /* ---------- 画环：从 12 点顺时针消耗 ---------- */
  var R = 88, C = 2 * Math.PI * R;
  function draw() {
    var q = PLAN[qi];
    var total = rest > 0 ? 5 : q.hold;                 // 休息固定 5 秒（试用版把节奏压短）
    var frac = total > 0 ? Math.max(0, Math.min(1, left / total)) : 0;
    $('bar').style.strokeDasharray = C;
    $('bar').style.strokeDashoffset = C * (1 - frac);
    var col = rest > 0 ? 'var(--rest)' : (setNo >= q.sets && rest === 0 && !running ? 'var(--done)' : 'var(--work)');
    $('bar').style.stroke = col;
    $('state').style.color = col;
    var ready = !running && rest === 0 && setNo === 0;
    $('state').textContent = rest > 0 ? '休息'
      : (setNo >= q.sets ? '完成' : (ready ? '准备开始' : (running ? '进行中' : '已暂停')));
    $('lab').textContent = rest > 0 ? '休息剩余' : (ready ? '本组目标' : '本组剩余');
    $('big').textContent = String(Math.ceil(left));
    $('mSets').textContent = String(setNo);
    $('mTime').textContent = fmt(elapsed);
    $('mLeft').textContent = (PLAN.length - qi) + ' 项';
    $('pTitle').textContent = q.name;
    $('pDesc').textContent = q.items + ' · ' + q.min + '。音量键完成本组或暂停，手上有汗也不用点屏幕。';
    renderQueue();
    $('start').textContent = !running && setNo === 0 && rest === 0
      ? (qi === 0 ? '开始训练' : '继续下一项：' + q.name)
      : (running ? '暂停' : '继续');
    // 音量 + 永远可做点什么（开始 / 记下这一组 / 跳过休息）—— 这正是这个产品的用法。
    $('up').disabled = false;
    $('down').disabled = setNo === 0 && rest === 0 && !running;
  }
  function fmt(s) {
    var m = Math.floor(s / 60), x = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }
  function renderQueue() {
    $('queue').innerHTML = PLAN.map(function (p, i) {
      var st = i < qi ? 'done' : (i === qi ? 'current' : 'todo');
      var tag = st === 'done' ? '已完成' : (st === 'current' ? '进行中' : '待开始');
      return '<span class="qitem" data-state="' + st + '">' + p.name + '<small>' + tag + '</small></span>';
    }).join('');
  }

  /* ---------- 计时 ---------- */
  function tick() {
    if (!running) return;
    elapsed++;
    if (rest > 0) {
      rest--; left = rest;
      if (rest === 0) { startSet(); }
    } else if (left > 0) {
      left--;
      if (left === 0) {               // 一组做完但没按键：停在 0，等音量键
        running = false; clearInterval(tickId); tickId = null;
        flash('本组做完了 —— 按音量 + 记下这一组');
      }
    }
    draw();
  }
  function startSet() {
    var q = PLAN[qi];
    if (setNo >= q.sets) { return; }
    setNo++;
    left = q.hold; running = true;
    if (!tickId) tickId = setInterval(tick, 1000);
    draw();
  }
  function startRest() {
    rest = 5; left = rest; running = true;
    if (!tickId) tickId = setInterval(tick, 1000);
    draw();
  }
  function flash(m) { $('flash').textContent = m; setTimeout(function () { if ($('flash').textContent === m) $('flash').textContent = ''; }, 3200); }

  /* ---------- 两个键 ---------- */
  function volUp() {
    var q = PLAN[qi];
    if (!running && rest === 0 && setNo === 0) { startSet(); flash('第 1 组开始'); return; }
    if (rest > 0) { rest = 0; startSet(); flash('跳过休息，进入第 ' + setNo + ' 组'); return; }
    if (!running && left === 0) {                 // 这一组确认完成
      if (setNo >= q.sets) {                        // 整项做完 → 换下一项
        finishItem();
      } else { startRest(); flash('第 ' + setNo + ' 组记下了，休息 5 秒'); }
      return;
    }
    if (!running) { running = true; if (!tickId) tickId = setInterval(tick, 1000); flash('继续'); draw(); return; }
    flash('这一组还没到点。到点后按音量 + 记下它。');
  }
  function volDown() {
    if (rest > 0) { flash('休息中。按音量 + 直接进下一组。'); return; }
    if (running) { running = false; flash('已暂停'); }
    else { running = true; if (!tickId) tickId = setInterval(tick, 1000); flash('继续'); }
    draw();
  }
  function finishItem() {
    running = false; rest = 0;
    if (tickId) { clearInterval(tickId); tickId = null; }
    qi++; setNo = 0; left = 0;
    if (qi >= PLAN.length) {
      qi = PLAN.length - 1; setNo = PLAN[PLAN.length - 1].sets; left = 0;
      draw();
      flash('全部完成。用时 ' + fmt(elapsed) + '。漏练不产生日期债务 —— 明天从队列第一项重新开始。');
      $('start').textContent = '重新开始';
      $('start').disabled = false;
      $('start').dataset.reset = '1';
      return;
    }
    draw();
    flash('这一项完成。下一个：' + PLAN[qi].name);
  }
  $('up').addEventListener('click', volUp);
  $('down').addEventListener('click', volDown);
  $('start').addEventListener('click', function () {
    if ($('start').dataset.reset === '1') {           // 重置一轮
      qi = 0; setNo = 0; left = 0; elapsed = 0; rest = 0; running = false;
      delete $('start').dataset.reset;
      if (tickId) { clearInterval(tickId); tickId = null; }
      draw(); flash('从头开始。'); return;
    }
    if (rest > 0) { rest = 0; startSet(); return; }
    if (!running && left === 0 && setNo === 0) { startSet(); flash('第 1 组开始'); return; }
    running = !running;
    if (running && !tickId) tickId = setInterval(tick, 1000);
    draw();
  });

  /* ---------- 键盘：真的音量键在浏览器里拿不到，方向键代替 ---------- */
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') { e.preventDefault(); pulse('up'); volUp(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); pulse('down'); volDown(); }
  });
  function pulse(id) {
    var b = $(id); b.classList.add('down');
    setTimeout(function () { b.classList.remove('down'); }, 140);
  }

  draw();
})();
</script>
</body>
</html>
