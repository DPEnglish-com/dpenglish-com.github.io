name: 验收

# 每次改动都跑一遍八道门。设计约定见 DESIGN.md §6。
#
# 为什么要有这个：这些门原本靠人手动跑，漏跑一次就可能把对比度不达标、
# 元素重叠、或者生成物不同步的东西推上线。第 0 道（生成物同步）尤其重要：
# 改了 data/products.json 却忘了重新生成，页面会安静地显示旧数据。
#
# 本机和 CI 跑的是同一个入口：node tools/verify.mjs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（只用于审计工具，不进线上产物）
        run: npm ci --no-audit --no-fund

      # 装 Google Chrome 官方 deb，不装 Ubuntu 的 chromium-browser。
      # 后者在 Ubuntu 上是个 snap 过渡包（chromium-browser 2:1snap1-0ubuntu2），
      # 装完不会在 /usr/bin 下留可执行文件，二进制落在 snap 里 ——
      # 实测就是这么失败过一次：apt 说装好了，三个候选路径全是空的。
      # 官方 deb 落在 /usr/bin/google-chrome-stable，路径确定。
      - name: 安装 Chrome
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable
          echo "CHROME_PATH=/usr/bin/google-chrome-stable" >> "$GITHUB_ENV"
          /usr/bin/google-chrome-stable --version

      - name: 跑八道门
        run: node tools/verify.mjs

      - name: 失败时留下截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 失败截图
          path: |
            /tmp/verify-map/*.png
            /tmp/verify-anim/*.png
          if-no-files-found: ignore
          retention-days: 7
